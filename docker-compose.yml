# The cloud half of the system: Postgres, Redis, schema migrations, and the
# cloud-api server. `docker compose up` brings all four up in order.
#
# The desktop app is deliberately absent. It is a native window that talks to
# the local SQLite databases on your machine, so it runs on the host:
#   cd apps/desktop && npm run tauri dev
services:
  db:
    image: pgvector/pgvector:pg18 # Postgres 18 with pgvector pre-installed
    container_name: ntk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # Migrations and the server both wait on this, so "started" is not
      # enough -- Postgres accepts connections only once this passes.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8
    container_name: ntk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    image: ntk-cloud-api
    container_name: ntk-migrate
    working_dir: /app/apps/cloud-api
    command: ["alembic", "upgrade", "head"]
    environment:
      NTK_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NTK_REDIS_DSN: redis://redis:6379/0
      NTK_OPEN_AI_API_KEY: ${NTK_OPEN_AI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  cloud-api:
    build: .
    image: ntk-cloud-api
    container_name: ntk-cloud-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Service names, not localhost: these resolve on the compose network.
      NTK_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NTK_REDIS_DSN: redis://redis:6379/0
      NTK_OPEN_AI_API_KEY: ${NTK_OPEN_AI_API_KEY}
      NTK_PORT: 8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        # Start only once the schema is actually in place.
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
