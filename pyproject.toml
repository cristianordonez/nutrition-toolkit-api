[tool.uv.workspace]
members = [
    "packages/*",
    "apps/cloud-api",
    "apps/desktop/engine",
]

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "docs" },
    { include-group = "fix" },
    { include-group = "migrations" },
]
migrations = [
    "alembic>=1.16.5",
]
test = [
    "covdefaults>=2.3.0",
    "coverage>=7.14.1",
    "diff-cover>=10.3.0",
    "pytest>=8.4.2",
    "pytest-cov",
]
docs = [
    "autodoc-pydantic>=2.2.0",
    "sphinx>=7.4.7",
    "sphinx-argparse-cli>=1.21.4",
    "sphinx-rtd-theme>=3.1.0",
]
fix = [
    "pre-commit>=4.6.0",
    "pre-commit-uv",
    "ruff>=0.15.16",
]
type = [
    "ty>=0.0.57",
]

[tool.ruff]
line-length = 88
indent-width = 4
unsafe-fixes = false
exclude = [
    ".git",
    ".venv",
    ".ruff_cache",
    ".tox",
    ".vscode",
    "dist"
]
lint.select = [ "ALL" ] # Select which linting rules to use
lint.ignore = [
    "CPY001", # Missing copyright
    "D100", # Ignore missing docstring in public modules
    "D101", # Ignore missing docstring in public class
    "D104", # Missing docstring in public package
    "D203", # incorrect blank line before class, conflicts with D211
    "D213", # multi line summary second line, conflicts with D212
] # Avoid enforcing specific violations
lint.fixable = [ "ALL" ] # Allow fix for all enabled rules (when `--fix`) is provided.
lint.unfixable = [ "F401" ] # Disables automatic or removal of unused imports, will still fail ruff checks
lint.per-file-ignores."!**/src/**.py" = [ "D" ] # Don't care about documentation in non package files
lint.per-file-ignores."**/tests/**/*.py" = [ "S101" ] # allow assert command in tests
lint.flake8-errmsg.max-string-length = 30 # Max length of string literal in error message
lint.flake8-import-conventions.banned-from = [ "typing" ]
lint.flake8-bugbear.extend-immutable-calls = [ "fastapi.Depends" ] # Allow settings default values using Depends
lint.isort = { known-first-party = [
    "ntk", "api", "engine", "tox", "tests"
], required-imports = [
    "from __future__ import annotations"
]}
format.docstring-code-line-length = "dynamic"
format.skip-magic-trailing-comma = false
format.line-ending = "auto"
format.quote-style = "double"
format.docstring-code-format = true
format.indent-style = "space"

[tool.ty]
environment.python-version = "3.14"
environment.root = [
    "./packages/ntk-core/src",
    "./apps/cloud-api/src",
    "./apps/desktop/engine/src",
]
src.include = [
    "packages/ntk-core/src",
    "apps/cloud-api/src",
    "apps/desktop/engine/src",
    "packages/ntk-core/tests",
    "apps/cloud-api/tests",
    "apps/desktop/engine/tests",
]

[tool.codespell]
count = true
quiet-level = 3
ignore-words-list = "abl,abd,gir,practioner,selectin,tge"

[tool.pytest]
# No default `testpaths`: always pass an explicit path (e.g.
# `uv run pytest apps/cloud-api/tests`) and run one package's suite per
# pytest process. cloud-api's and engine's command-group registries are
# process-global (ntk.controllers.registry.COMMAND_REGISTRY), so their two
# suites can never share a process -- importing both raises a real
# `ValueError` at collection time. Separately (and unrelated to that),
# packages/ntk-core/tests/test_parallel.py's "process" mode test spawns a
# real multiprocessing.Pool and has been observed to hang unpredictably in
# this environment even completely on its own -- `tox -e tests` deselects it
# (`-k "not process"`) for automated runs; run it manually only when you
# specifically need to exercise that code path.
ini_options.addopts = "--import-mode=importlib"
ini_options.filterwarnings = [
    "ignore:unclosed database in <sqlite3.Connection object at:ResourceWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]


[tool.coverage]
run.parallel = true
run.plugins = [
  "covdefaults",
]
paths.source = [
  "packages/ntk-core/src",
  "apps/cloud-api/src",
  "apps/desktop/engine/src",
  ".tox*/*/lib/python*/site-packages",
  ".tox*/pypy*/site-packages",
  ".tox*\\*\\Lib\\site-packages",
  "*/src",
  "*\\src",
]
report.fail_under = 80
report.omit = []
html.show_contexts = true
html.skip_covered = false
