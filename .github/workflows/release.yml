name: "Release Workflow"
on:
    workflow_dispatch:
      inputs:
        version:
          description: "Release version"
          required: true
          type: string
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        run: |
            python -m pip install --upgrade pip
            pip install uv

