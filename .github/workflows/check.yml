name: check
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/setup-python@v6
          with:
            python-version: "3.14"
        - name: Install uv
          run: |
            python -m pip install --upgrade pip
            pip install uv
        - name: Install tox
          run: |
            uv tool install tox --with tox-uv
        - uses: actions/checkout@v6
        - name: Run tox test suites
          run: |
            tox -e py312,py313,py314, py315

  check:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v6
        - uses: actions/setup-python@v6
          with:
            python-version: "3.14"
        - name: Install uv
          run: |
            python -m pip install --upgrade pip
            pip install uv
        - name: Install tox
          run: |
            uv tool install tox --with tox-uv
        - name: Run tox check suites
          run: |
            tox -e fix
        - name: Run tox type checks
          run: |
            tox -e type
