name: check
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/setup-python@v6
          with:
            python-version: "3.14"
        - name: Install uv
          run: |
            python -m pip install --upgrade pip
            pip install uv
        - name: Install tox
          run: |
            uv tool install tox --with tox-uv
        - uses: actions/checkout@v6
          with:
            fetch-depth: 0
        - name: Run tox test suites
          run: |
            tox -e py312,py313,py314,py315

  check:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v7
        - name: Install uv
          uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        - name: Install tox
          run: |
            uv tool install tox --with tox-uv
        - name: Run tox check suites
          run: |
            tox -e fix
        - name: Run tox type checks
          run: |
            tox -e type
