[build-system]
requires = [
    "hatchling >= 1.26",
    "hatch-vcs==0.3.0"
]
build-backend = "hatchling.build"

[project]
name = "ntk-core"
description = "Shared Pydantic schemas and generic utilities for the nutrition toolkit apps"
dynamic = [ "version" ]
authors = [
    {name = "Cristian Ordonez", email = "cristianordonezrd@gmail.com"},
]
requires-python = ">= 3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.11.0",
    "tiktoken>=0.14.0",
]

[tool.hatch]
version.source = "vcs"
version.raw-options = { root = "../..", search_parent_directories = true }
build.hooks.vcs.version-file = "src/ntk/_version.py"
build.dev-mode-dirs = [
  "src",
]
build.targets.sdist.include = [
    "src",
]
build.targets.wheel.packages = [ "src/ntk" ]
