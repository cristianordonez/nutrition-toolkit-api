requires = [ "tox>=4.54" ]
env_list = [
    "tests",
    "docs",
    "fix",
    "ruff",
    "type",
]
skip_missing_interpreters = true

[env.tests]
description = "run every workspace package's tests (each its own process) with combined coverage"
runner = "uv-venv-lock-runner"
base_python = [ "3.14" ]
dependency_groups = [ "test" ]
set_env.COVERAGE_FILE = { replace = "env", name = "COVERAGE_FILE", default = "{work_dir}{/}.coverage.{env_name}" }
commands = [
  # Each app's suite runs as its own `coverage run` subprocess and
  # `coverage combine` merges the two data files below into one report.
  #
  # They are kept apart because each app registers a command group named
  # `ncp` on its own process-global `controllers.registry.COMMAND_REGISTRY`.
  # Since each now owns a private copy of that registry, importing both into
  # one process would register `ncp` twice and raise.
  [
    "coverage", "run", "--data-file={env:COVERAGE_FILE}",
    "--source=apps/server/src",
    "-m", "pytest", "apps/server/tests",
    { replace = "posargs", default = [], extend = true },
  ],
  [
    "coverage", "run", "--data-file={env:COVERAGE_FILE}",
    "--source=apps/desktop/engine/src",
    "-m", "pytest", "apps/desktop/engine/tests",
    { replace = "posargs", default = [], extend = true },
  ],
  [ "coverage", "combine", "--data-file={env:COVERAGE_FILE}" ],
  [ "coverage", "report", "--data-file={env:COVERAGE_FILE}" ],
  [
    "coverage", "xml", "--data-file={env:COVERAGE_FILE}",
    "-o", "{work_dir}{/}coverage.{env_name}.xml",
  ],
  [
    "diff-cover",
    "--compare-branch",
    { replace = "env", name = "DIFF_AGAINST", default = "origin/main" },
    "{work_dir}{/}coverage.{env_name}.xml",
  ],
]

[env.docs]
description = "build the docs"
dependency_groups = [ "docs" ]
base_python = [ "3.14" ]
commands = [
  [
    "sphinx-build",
    "-b",
    "html",
    "docs/",
    "{env:READTHEDOCS_OUTPUT:{work_dir}{/}docs_out}/html", # uses READTHEDOCS_OUTPUT/html when building on readthedocs otherwise local .tox dir
    { replace = "posargs", default = [], extend = true },
  ],
  [
    "python",
    "-c",
    'print(r"documentation available under file://{work_dir}{/}docs_out{/}html{/}index.html")',
  ]
]

[env.fix]
description = "lint and format check the code base and complain about what we cannot do automatically"
skip_install = true
dependency_groups = [ "fix" ]
commands = [ [
    "pre-commit",
    "run",
    "--all-files",
    "--show-diff-on-failure",
    { replace = "posargs", extend = true }
] ]

[env.ruff]
description = "lint and format-check the code base"
skip_install = true
dependency_groups = [ "fix" ]
commands = [
  ["ruff", "check", "."],
  ["ruff", "format", "--check", "."],
]

[env.type]
description = "type check the code base"
runner = "uv-venv-lock-runner"
dependency_groups = [ "type" ]
commands = [ [
    "ty",
    "check",
    { replace = "posargs", extend = true }
] ]

[env.migration]
description = "Create an autogenerated Alembic migration for apps/server"
change_dir = "apps/server"
commands = [
  ["uv", "run", "python", "../../scripts/create_migration.py", "{posargs}"],
]

[env.up]
description = "start the server stack (Postgres, Redis, migrations, FastAPI)"
skip_install = true
allowlist_externals = [ "docker" ]
commands = [
  ["docker", "compose", "up", "--build", "-d", "--wait"],
  ["docker", "compose", "ps"],
]

[env.down]
description = "stop the server stack; pass -- -v to also drop its data volumes"
skip_install = true
allowlist_externals = [ "docker" ]
commands = [
  [
    "docker", "compose", "down", "--remove-orphans",
    { replace = "posargs", default = [], extend = true },
  ],
]

[env.logs]
description = "follow server logs"
skip_install = true
allowlist_externals = [ "docker" ]
commands = [
  ["docker", "compose", "logs", "-f", "{posargs:server}"],
]

[env.api-key]
description = "mint an API key for the desktop engine to call server"
skip_install = true
allowlist_externals = [ "docker" ]
commands = [
  ["docker", "compose", "exec", "server", "server-cli", "key", "create",
   "--name", "{posargs:desktop-engine}",
   "--permissions", "ncp:read", "ncp:write"],
]
