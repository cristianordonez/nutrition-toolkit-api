requires = [ "tox>=4.54" ]
env_list = [
    "tests",
    "docs",
    "fix",
    "ruff",
    "type",
]
skip_missing_interpreters = true

[env.tests]
description = "run every workspace package's tests (each its own process) with combined coverage"
runner = "uv-venv-lock-runner"
base_python = [ "3.14" ]
dependency_groups = [ "test" ]
set_env.COVERAGE_FILE = { replace = "env", name = "COVERAGE_FILE", default = "{work_dir}{/}.coverage.{env_name}" }
commands = [
  # cloud-api's and engine's command-group registries are process-global
  # (ntk.controllers.registry.COMMAND_REGISTRY) and can never share a
  # process, so each package's suite runs as its own `coverage run`
  # subprocess; `coverage combine` merges the three data files below into
  # one report. ntk-core's `-k "not process"` deselects a multiprocessing
  # test that hangs unpredictably in this environment on its own -- see the
  # `[tool.pytest]` comment in this file.
  [
    "coverage", "run", "--data-file={env:COVERAGE_FILE}",
    "--source=packages/ntk-core/src",
    "-m", "pytest", "packages/ntk-core/tests", "-k", "not process",
    { replace = "posargs", default = [], extend = true },
  ],
  [
    "coverage", "run", "--data-file={env:COVERAGE_FILE}",
    "--source=apps/cloud-api/src",
    "-m", "pytest", "apps/cloud-api/tests",
    { replace = "posargs", default = [], extend = true },
  ],
  [
    "coverage", "run", "--data-file={env:COVERAGE_FILE}",
    "--source=apps/desktop/engine/src",
    "-m", "pytest", "apps/desktop/engine/tests",
    { replace = "posargs", default = [], extend = true },
  ],
  [ "coverage", "combine", "--data-file={env:COVERAGE_FILE}" ],
  [ "coverage", "report", "--data-file={env:COVERAGE_FILE}" ],
  [
    "coverage", "xml", "--data-file={env:COVERAGE_FILE}",
    "-o", "{work_dir}{/}coverage.{env_name}.xml",
  ],
  [
    "diff-cover",
    "--compare-branch",
    { replace = "env", name = "DIFF_AGAINST", default = "origin/main" },
    "{work_dir}{/}coverage.{env_name}.xml",
  ],
]

[env.docs]
description = "build the docs"
dependency_groups = [ "docs" ]
base_python = [ "3.14" ]
commands = [
  [
    "sphinx-build",
    "-b",
    "html",
    "docs/",
    "{env:READTHEDOCS_OUTPUT:{work_dir}{/}docs_out}/html", # uses READTHEDOCS_OUTPUT/html when building on readthedocs otherwise local .tox dir
    { replace = "posargs", default = [], extend = true },
  ],
  [
    "python",
    "-c",
    'print(r"documentation available under file://{work_dir}{/}docs_out{/}html{/}index.html")',
  ]
]

[env.fix]
description = "lint and format check the code base and complain about what we cannot do automatically"
skip_install = true
dependency_groups = [ "fix" ]
commands = [ [
    "pre-commit",
    "run",
    "--all-files",
    "--show-diff-on-failure",
    { replace = "posargs", extend = true }
] ]

[env.ruff]
description = "lint and format-check the code base"
skip_install = true
dependency_groups = [ "fix" ]
commands = [
  ["ruff", "check", "."],
  ["ruff", "format", "--check", "."],
]

[env.type]
description = "type check the code base"
runner = "uv-venv-lock-runner"
dependency_groups = [ "type" ]
commands = [ [
    "ty",
    "check",
    { replace = "posargs", extend = true }
] ]

[env.migration]
description = "Create an autogenerated Alembic migration for apps/cloud-api"
change_dir = "apps/cloud-api"
commands = [
  ["uv", "run", "python", "../../scripts/create_migration.py", "{posargs}"],
]
